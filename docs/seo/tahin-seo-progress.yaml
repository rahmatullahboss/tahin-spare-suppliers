findings:
  - id: SEO-001
    severity: critical
    status: resolved
    summary: Product CMS lacked required buyer and SEO fields.
    resolution: >-
      Added Part Number, Condition, Availability, Location, Application, Technical Specifications,
      SEO Title, Meta Description, Focus Keyword, Image ALT and Related Products through database,
      repository, API and admin editor.
  - id: SEO-002
    severity: critical
    status: resolved
    summary: Product structured data fabricated a USD zero price and hard-coded stock/condition.
    resolution: >-
      Removed fabricated Offer/price and hard-coded stock facts. Product JSON-LD now derives only
      supported product facts and safe condition mappings from the product record.
  - id: SEO-003
    severity: critical
    status: resolved
    summary: Repository omitted parts ContentType although parts API and sitemap used it.
    resolution: Added parts to CONTENT_TABLES and certified parts route/sitemap use.
  - id: SEO-004
    severity: high
    status: resolved
    summary: Dynamic sitemap collection was incomplete and one failure could collapse dynamic output.
    resolution: >-
      Added paginated listAllContent enumeration, Promise.allSettled isolation, categories,
      subcategories, real brand pages, products, parts and blog URLs with de-duplication.
  - id: SEO-005
    severity: high
    status: resolved
    summary: Missing dynamic records redirected instead of returning true 404 responses.
    resolution: Product, part, blog, category, subcategory and brand detail routes now return HTTP 404.
  - id: SEO-006
    severity: high
    status: code_resolved_external_account_action_pending
    summary: No GA4 or Search Console verification configuration existed in runtime env.
    resolution: >-
      Added environment-backed GOOGLE_ANALYTICS_ID and GOOGLE_SITE_VERIFICATION hooks plus exact
      account-side setup checklist. Real Google account identifiers remain intentionally external.
  - id: SEO-007
    severity: medium
    status: resolved
    summary: Main navigation was not aligned to buyer-intent hierarchy and had no Brands hub.
    resolution: >-
      Added Engines, Gensets, Spare Parts, Hydraulics, Brands, Resources and Request Quote navigation,
      plus /brands and /brands/[brand] inventory pages.
  - id: SEO-008
    severity: medium
    status: resolved
    summary: Product/category/blog detail pages lacked consistent breadcrumb semantics.
    resolution: Added reusable visible Breadcrumbs with BreadcrumbList JSON-LD across priority routes.
  - id: SEO-009
    severity: medium
    status: resolved
    summary: Missing hero image references caused broken resources/build warnings.
    resolution: Replaced missing references with an existing warehouse asset; final build has zero warnings.
  - id: SEO-010
    severity: medium
    status: resolved
    summary: Legacy static category routes overlapped dynamic category search intent.
    resolution: >-
      Legacy category pages remain usable but canonicalize to the dynamic category authority and are
      omitted from the sitemap.
  - id: SEO-011
    severity: high
    status: resolved
    summary: Dependency audit found high-severity nanoid/undici advisories in the existing dependency tree.
    resolution: npm audit fix updated safe dependency resolutions; final audit reports zero vulnerabilities.
  - id: SEO-012
    severity: medium
    status: resolved
    summary: Public product hub still used the legacy "Sell Equipments" title and H1.
    resolution: >-
      Repositioned /products as the Marine Engines, Generators & Spare Parts hub, added breadcrumbs,
      buyer-focused metadata and reserved category-image dimensions.
  - id: SEO-013
    severity: medium
    status: resolved
    summary: Product/brand enquiry query context was ignored and buyer conversion actions were not measured.
    resolution: >-
      Enquiry pages now prefill product/brand context. GA4-enabled deployments emit generate_lead,
      request_quote_click, whatsapp_product_click and whatsapp_contact_click events.

