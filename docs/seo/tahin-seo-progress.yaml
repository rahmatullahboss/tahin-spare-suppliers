production_delivery:
  local_commit:
    status: complete
    sha_before_progress_amend: 599bfd2
    message: "feat: implement buyer-intent SEO system"
  direct_wrangler_deploy:
    status: blocked_by_missing_process_cloudflare_api_token
    safe_alternative: master branch CI deploy workflow
  github_push:
    status: blocked_by_repository_write_permission
    evidence:
      - HTTPS origin has no non-interactive Git credential helper or credential store.
      - Default Tahin GitHub deploy key authenticates but is marked read-only.
      - Other available authenticated SSH deploy keys do not have write permission to this repository.
    required_to_continue: >-
      Grant a write-capable credential/deploy key for rahmatullahboss/tahin-spare-suppliers or provide
      CLOUDFLARE_API_TOKEN for direct Wrangler deployment.
  ci_workflow: .github/workflows/ci-deploy.yml
  ci_contract:
    - npm ci
    - npm test
    - npm audit --omit=dev
    - npm run build
    - npx wrangler deploy --dry-run
    - deploy with GitHub Cloudflare secrets when configured
    - npm run smoke:production
  status: code_committed_locally_push_and_deploy_blocked_by_external_write_credentials

external_actions:
  - id: EXT-GA4-ID
    status: waiting_for_google_account_value
    required: actual GA4 G- measurement ID
    code_blocker: false
  - id: EXT-GSC-VERIFY
    status: waiting_for_google_account_access
    required: actual Search Console verification token or DNS property verification
    code_blocker: false
  - id: EXT-GSC-SITEMAP
    status: waiting_for_google_account_access_and_deployed_release
    required: submit https://tahinspare.com/sitemap.xml in Search Console
    code_blocker: false
  - id: EXT-CWV-FIELD
    status: waiting_for_post_deploy_field_data
    required: verify real-user LCP/INP/CLS in Search Console/PageSpeed after sufficient traffic
    code_blocker: false

notes:
  - Existing indexed /products/{slug} URLs are intentionally preserved.
  - Google account identifiers are never guessed or committed as fake production values.
  - Product schema intentionally omits a fabricated Offer because pricing is quote-based.
  - Progress must be updated after the master CI deployment result is known.

